<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>냉장고 재고</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:#0B1420; color:#E8F1F8; }
  .wrap { max-width:820px; margin:0 auto; padding:26px 18px 60px; }
  .eyebrow { font-size:11px; letter-spacing:3px; color:#7DD3FC; font-weight:700; margin-bottom:2px; }
  h1 { font-size:26px; font-weight:800; margin:0 0 18px; letter-spacing:-0.5px; }
  .diagram { background:#0E1826; border:1px solid #1B2A3C; border-radius:14px; padding:10px; margin-bottom:18px; }
  .door-row { display:flex; gap:8px; margin-bottom:8px; }
  .door-row:last-child { margin-bottom:0; }
  .door-btn { flex:1; border:none; border-radius:8px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
  .door-top { background:#C9BEB0; color:#2A241D; }
  .door-bottom { background:#1E2C3E; color:#7DD3FC; border:1px solid #2A3B52; }
  .door-count { font-size:11px; opacity:.75; font-weight:500; }
  .err { background:rgba(248,113,113,.12); border:1px solid #F87171; color:#F87171; padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:13px; display:none; }
  .cam-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; align-items:center; justify-content:center; flex-direction:column; padding:16px; }
  .cam-modal.open { display:flex; }
  .cam-modal video, .cam-modal canvas { width:100%; max-width:480px; border-radius:14px; background:#000; }
  .cam-controls { display:flex; gap:10px; margin-top:14px; }
  .cam-btn { border:none; border-radius:999px; padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .cam-shoot { background:#7DD3FC; color:#0B1420; }
  .cam-cancel { background:#22334A; color:#E8F1F8; }
  .cam-status { color:#9FB3C8; font-size:13px; margin-top:10px; text-align:center; }
  .pending-panel { background:#131F2E; border:1px solid #22334A; border-radius:14px; padding:14px; margin-bottom:20px; display:none; }
  .pending-panel.open { display:block; }
  .pending-head { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#9FB3C8; margin-bottom:10px; }
  .confirm-all { background:#4ADE80; color:#0B1420; border:none; border-radius:8px; padding:5px 10px; font-weight:700; font-size:12px; cursor:pointer; }
  .pending-row { display:flex; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap; }
  input, select { background:#0B1420; border:1px solid #22334A; border-radius:8px; color:#E8F1F8; padding:6px 10px; font-size:13px; font-family:inherit; }
  .p-name { flex:1; min-width:100px; }
  .p-small { width:110px; }
  .icon-btn { border:none; border-radius:8px; padding:7px; cursor:pointer; display:flex; }
  .icon-good { background:rgba(74,222,128,.15); color:#4ADE80; }
  .icon-bad { background:rgba(248,113,113,.15); color:#F87171; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:600px){ .grid{ grid-template-columns:1fr; } }
  .section { background:#101B29; border:1px solid #1B2A3C; border-radius:14px; padding:16px; scroll-margin-top:12px; }
  .sec-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .sec-icon { width:30px; height:30px; border-radius:8px; background:#1B2A3C; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .sec-title { font-size:15px; font-weight:700; }
  .sec-sub { font-size:11px; color:#7A8CA3; }
  .scan-btn { display:flex; align-items:center; gap:5px; background:#7DD3FC; color:#0B1420; border:none; border-radius:999px; padding:6px 10px; font-weight:700; font-size:11.5px; cursor:pointer; margin-left:auto; font-family:inherit; }
  .item-card { background:#131F2E; border:1px solid #22334A; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .item-top { display:flex; justify-content:space-between; align-items:center; }
  .item-name { font-weight:600; font-size:14px; }
  .item-meta { display:flex; justify-content:space-between; font-size:11.5px; color:#9FB3C8; margin-top:4px; }
  .bar-track { height:4px; background:#22334A; border-radius:999px; margin-top:6px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; }
  .trash-btn { background:transparent; border:none; color:#5A6E85; cursor:pointer; }
  .empty { font-size:12.5px; color:#5A6E85; padding:10px 4px; }
  .add-toggle { display:flex; align-items:center; gap:6px; background:transparent; border:1px dashed #2A3B52; color:#7A8CA3; border-radius:10px; padding:8px 10px; font-size:12.5px; cursor:pointer; margin-top:4px; width:100%; font-family:inherit; }
  .add-form { display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MY FRIDGE · 4-DOOR</div>
  <h1>냉장고 재고</h1>

  <div class="diagram">
    <div class="door-row">
      <button class="door-btn door-top" data-scroll="fridge"><span>냉장실</span><span class="door-count" id="cnt-fridge">0개</span></button>
    </div>
    <div class="door-row">
      <button class="door-btn door-bottom" data-scroll="freezer-left"><span>냉동실 좌</span><span class="door-count" id="cnt-freezer-left">0개</span></button>
      <button class="door-btn door-bottom" data-scroll="freezer-right"><span>냉동실 우</span><span class="door-count" id="cnt-freezer-right">0개</span></button>
    </div>
  </div>

  <div class="err" id="errBox"></div>
  <div class="pending-panel" id="pendingPanel">
    <div class="pending-head"><span id="pendingLabel">인식된 항목</span><button class="confirm-all" id="confirmAllBtn">전체 담기</button></div>
    <div id="pendingList"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="cam-modal" id="camModal">
  <video id="camVideo" autoplay playsinline></video>
  <canvas id="camCanvas" style="display:none;"></canvas>
  <div class="cam-controls">
    <button class="cam-btn cam-shoot" id="camShoot">촬영</button>
    <button class="cam-btn cam-cancel" id="camCancel">취소</button>
  </div>
  <div class="cam-status" id="camStatus"></div>
</div>

<script>
const ZONES = [
  { key:"fridge", label:"냉장실", type:"fresh", row:"top" },
  { key:"freezer-left", label:"냉동실 좌", type:"frozen", row:"bottom" },
  { key:"freezer-right", label:"냉동실 우", type:"frozen", row:"bottom" },
];
const ZONE_MAP = Object.fromEntries(ZONES.map(z => [z.key, z]));
// old layout had fridge-left/fridge-right — merge any saved items from those into "fridge"
const ZONE_MIGRATION = { "fridge-left": "fridge", "fridge-right": "fridge" };

const STARTER_ITEMS = [
  { name:"해찬들 태양초 고추장", zone:"fridge", shelfLifeDays:180 },
  { name:"김치", zone:"fridge", shelfLifeDays:30 },
  { name:"테라 맥주캔", zone:"fridge", shelfLifeDays:90 },
  { name:"코카콜라 페트", zone:"fridge", shelfLifeDays:120 },
  { name:"반찬 (밑반찬통 여러개)", zone:"fridge", shelfLifeDays:7 },
  { name:"신선야채실 - 야채", zone:"fridge", shelfLifeDays:7 },
  { name:"신선육류실 - 육류", zone:"fridge", shelfLifeDays:5 },
  { name:"마요네즈", zone:"fridge", shelfLifeDays:180 },
  { name:"머스타드 (Maille)", zone:"fridge", shelfLifeDays:365 },
  { name:"장류/소스병 여러개", zone:"fridge", shelfLifeDays:180 },
  { name:"들깨가루", zone:"freezer-right", expiryDate:"" },
  { name:"냉동 만두/찐빵류", zone:"freezer-left", expiryDate:"" },
  { name:"냉동 육류", zone:"freezer-left", expiryDate:"" },
  { name:"냉동 생선/해산물", zone:"freezer-right", expiryDate:"" },
];

const STORAGE_KEY = "fridge:items-v2";
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// storage: use window.storage when available (claude.ai preview), else localStorage (real browser), else in-memory
let memStore = null;
async function loadItems() {
  try {
    if (window.storage) {
      const r = await window.storage.get(STORAGE_KEY);
      return r ? JSON.parse(r.value) : null;
    }
  } catch(e) {}
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) {}
  return memStore;
}
async function saveItems(items) {
  try { if (window.storage) { await window.storage.set(STORAGE_KEY, JSON.stringify(items)); return; } } catch(e) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); return; } catch(e) {}
  memStore = items;
}

let items = [];
let pending = [];
let activeZone = null;
let mediaStream = null;

function freshnessInfo(elapsed, shelfLife){
  const ratio = shelfLife ? elapsed/shelfLife : 0;
  if (ratio < 0.5) return {color:"#4ADE80", label:"신선"};
  if (ratio < 0.85) return {color:"#FBBF24", label:"주의"};
  return {color:"#F87171", label:"임박/경과"};
}
function expiryInfo(daysLeft){
  if (daysLeft > 14) return {color:"#7DD3FC", label:"여유"};
  if (daysLeft > 0) return {color:"#FBBF24", label:"임박"};
  return {color:"#F87171", label:"만료"};
}

function showError(msg){
  const box = document.getElementById("errBox");
  if(!msg){ box.style.display="none"; return; }
  box.textContent = msg;
  box.style.display = "block";
}

async function init(){
  const loaded = await loadItems();
  if (loaded) {
    items = loaded.map(it => ZONE_MIGRATION[it.zone] ? { ...it, zone: ZONE_MIGRATION[it.zone] } : it);
    await saveItems(items);
  } else {
    items = STARTER_ITEMS.map((s,i) => ({
      id:`seed_${i}`, name:s.name, zone:s.zone, addedDate:todayISO(),
      shelfLifeDays:s.shelfLifeDays ?? null, expiryDate:s.expiryDate ?? null,
    }));
    await saveItems(items);
  }
  render();
}

function render(){
  ZONES.forEach(z => {
    document.getElementById(`cnt-${z.key}`).textContent = `${items.filter(i=>i.zone===z.key).length}개`;
  });
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  ZONES.forEach(z => {
    const sec = document.createElement("div");
    sec.className = "section";
    sec.id = `sec-${z.key}`;
    if (z.key === "fridge") sec.style.gridColumn = "1 / -1";
    const list = items.filter(i => i.zone === z.key).sort((a,b) => {
      if (z.type === "fresh") return daysBetween(b.addedDate, todayISO())/(b.shelfLifeDays||7) - daysBetween(a.addedDate, todayISO())/(a.shelfLifeDays||7);
      const da = a.expiryDate ? daysBetween(todayISO(), a.expiryDate) : 9999;
      const db = b.expiryDate ? daysBetween(todayISO(), b.expiryDate) : 9999;
      return da - db;
    });
    let itemsHtml = "";
    if (list.length === 0) itemsHtml = `<div class="empty">아직 등록된 항목이 없어요</div>`;
    list.forEach(it => {
      if (z.type === "fresh") {
        const elapsed = daysBetween(it.addedDate, todayISO());
        const {color,label} = freshnessInfo(elapsed, it.shelfLifeDays||7);
        const ratio = Math.min(1, elapsed/(it.shelfLifeDays||7));
        itemsHtml += `<div class="item-card">
          <div class="item-top"><span class="item-name">${esc(it.name)}</span>
          <button class="trash-btn" data-remove="${it.id}">✕</button></div>
          <div class="item-meta"><span>${elapsed}일 경과</span><span style="color:${color}">${label}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${ratio*100}%;background:${color}"></div></div>
        </div>`;
      } else {
        const daysLeft = it.expiryDate ? daysBetween(todayISO(), it.expiryDate) : null;
        const info = daysLeft !== null ? expiryInfo(daysLeft) : {color:"#7A8CA3", label:"기한 미상"};
        const metaText = it.expiryDate ? (daysLeft>=0 ? `${it.expiryDate} · D-${daysLeft}` : `${it.expiryDate} · ${-daysLeft}일 경과`) : "유통기한 미입력";
        itemsHtml += `<div class="item-card">
          <div class="item-top"><span class="item-name">${esc(it.name)}</span>
          <button class="trash-btn" data-remove="${it.id}">✕</button></div>
          <div class="item-meta"><span>${metaText}</span><span style="color:${info.color}">${info.label}</span></div>
        </div>`;
      }
    });
    sec.innerHTML = `
      <div class="sec-head">
        <div class="sec-icon">${z.type==="fresh" ? "🥬" : "❄️"}</div>
        <div><div class="sec-title">${z.label}</div><div class="sec-sub">${list.length}개</div></div>
        <button class="scan-btn" data-scan="${z.key}">📷 촬영</button>
      </div>
      <div>${itemsHtml}</div>
      <button class="add-toggle" data-addtoggle="${z.key}">✎ 직접 추가</button>
      <div class="add-form" id="addform-${z.key}" style="display:none;"></div>
    `;
    grid.appendChild(sec);
  });
  attachHandlers();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function attachHandlers(){
  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.onclick = async () => {
      items = items.filter(i => i.id !== btn.dataset.remove);
      await saveItems(items);
      render();
    };
  });
  document.querySelectorAll("[data-scroll]").forEach(btn => {
    btn.onclick = () => document.getElementById(`sec-${btn.dataset.scroll}`)?.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.querySelectorAll("[data-scan]").forEach(btn => {
    btn.onclick = () => openCamera(btn.dataset.scan);
  });
  document.querySelectorAll("[data-addtoggle]").forEach(btn => {
    btn.onclick = () => toggleAddForm(btn.dataset.addtoggle);
  });
}

function toggleAddForm(zoneKey){
  const form = document.getElementById(`addform-${zoneKey}`);
  const zone = ZONE_MAP[zoneKey];
  if (form.style.display === "none") {
    form.style.display = "flex";
    if (zone.type === "fresh") {
      form.innerHTML = `<input class="p-name" id="mf-name-${zoneKey}" placeholder="식품명" />
        <input class="p-small" id="mf-days-${zoneKey}" type="number" value="7" title="보관 가능 일수" />
        <button class="icon-btn icon-good" id="mf-ok-${zoneKey}">✓</button>
        <button class="icon-btn icon-bad" id="mf-cancel-${zoneKey}">✕</button>`;
    } else {
      form.innerHTML = `<input class="p-name" id="mf-name-${zoneKey}" placeholder="식품명" />
        <input class="p-small" id="mf-date-${zoneKey}" type="date" />
        <button class="icon-btn icon-good" id="mf-ok-${zoneKey}">✓</button>
        <button class="icon-btn icon-bad" id="mf-cancel-${zoneKey}">✕</button>`;
    }
    document.getElementById(`mf-cancel-${zoneKey}`).onclick = () => { form.style.display="none"; form.innerHTML=""; };
    document.getElementById(`mf-ok-${zoneKey}`).onclick = async () => {
      const name = document.getElementById(`mf-name-${zoneKey}`).value.trim();
      if (!name) return;
      if (zone.type === "fresh") {
        const days = Number(document.getElementById(`mf-days-${zoneKey}`).value) || 7;
        items.push({id:`i_${Date.now()}`, name, zone:zoneKey, addedDate:todayISO(), shelfLifeDays:days, expiryDate:null});
      } else {
        const date = document.getElementById(`mf-date-${zoneKey}`).value || null;
        items.push({id:`i_${Date.now()}`, name, zone:zoneKey, addedDate:todayISO(), shelfLifeDays:null, expiryDate:date});
      }
      await saveItems(items);
      render();
    };
  } else {
    form.style.display = "none";
    form.innerHTML = "";
  }
}

// ---- Camera ----
async function openCamera(zoneKey){
  activeZone = zoneKey;
  showError(null);
  const modal = document.getElementById("camModal");
  const video = document.getElementById("camVideo");
  const status = document.getElementById("camStatus");
  status.textContent = "카메라를 여는 중...";
  modal.classList.add("open");
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = mediaStream;
    status.textContent = "";
  } catch (err) {
    status.textContent = "카메라를 열 수 없어요 (권한 거부 또는 미지원). 이 페이지를 브라우저에서 직접 열었는지 확인해주세요.";
  }
}
function stopCamera(){
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  document.getElementById("camModal").classList.remove("open");
}
document.getElementById("camCancel").onclick = stopCamera;
document.getElementById("camShoot").onclick = async () => {
  const video = document.getElementById("camVideo");
  const canvas = document.getElementById("camCanvas");
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
  const base64 = dataUrl.split(",")[1];
  stopCamera();
  await recognizeAndShow(base64, "image/jpeg");
};

async function recognizeAndShow(base64, mediaType){
  const status = document.getElementById("camStatus");
  showError(null);
  try {
    const prompt = `이 사진에 보이는 식품 아이템들을 각각 식별해줘. 각 아이템에 대해 아래 정보를 JSON 배열로만 응답해 (설명, 마크다운 코드블록 없이 순수 JSON만):
[{"name": "한글 식품명", "category": "fresh 또는 frozen", "estimatedShelfLifeDays": 신선식품일 경우 일반적 냉장 보관 가능 일수(정수, 냉동이면 null), "packageExpiryDate": "포장에 유통기한이 보이면 YYYY-MM-DD, 없으면 null"}]`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role:"user", content: [
          { type:"image", source:{ type:"base64", media_type: mediaType, data: base64 } },
          { type:"text", text: prompt },
        ]}],
      }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if (!textBlock) throw new Error("no text");
    const clean = textBlock.text.replace(/```json|```/g, "").trim();
    const recognized = JSON.parse(clean);
    const zoneDef = ZONE_MAP[activeZone];
    pending = recognized.map((it,i) => ({
      tempId:`p${Date.now()}_${i}`, name: it.name || "이름 없음", zone: activeZone,
      type: zoneDef.type === "frozen" ? "frozen" : "fresh",
      estimatedShelfLifeDays: it.estimatedShelfLifeDays || 7,
      packageExpiryDate: it.packageExpiryDate || "",
    }));
    renderPending();
  } catch (err) {
    showError("인식에 실패했어요 (네트워크 또는 응답 형식 문제). 아래에서 수동으로 추가해주세요.");
  }
}

function renderPending(){
  const panel = document.getElementById("pendingPanel");
  const list = document.getElementById("pendingList");
  document.getElementById("pendingLabel").textContent = `인식된 항목 ${pending.length}개 — 확인 후 담아주세요`;
  if (pending.length === 0) { panel.classList.remove("open"); list.innerHTML=""; return; }
  panel.classList.add("open");
  list.innerHTML = pending.map(it => `
    <div class="pending-row" data-row="${it.tempId}">
      <input class="p-name" data-field="name" value="${esc(it.name)}" />
      ${it.type === "fresh"
        ? `<input class="p-small" data-field="days" type="number" value="${it.estimatedShelfLifeDays}" title="보관 가능 일수" />`
        : `<input class="p-small" data-field="date" type="date" value="${it.packageExpiryDate}" />`}
      <button class="icon-btn icon-good" data-confirm="${it.tempId}">✓</button>
      <button class="icon-btn icon-bad" data-discard="${it.tempId}">✕</button>
    </div>
  `).join("");
  list.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => confirmPending(b.dataset.confirm));
  list.querySelectorAll("[data-discard]").forEach(b => b.onclick = () => { pending = pending.filter(p => p.tempId !== b.dataset.discard); renderPending(); });
}
document.getElementById("confirmAllBtn").onclick = () => { [...pending].forEach(it => confirmPending(it.tempId)); };

async function confirmPending(tempId){
  const row = document.querySelector(`[data-row="${tempId}"]`);
  const it = pending.find(p => p.tempId === tempId);
  if (!it) return;
  if (row) {
    it.name = row.querySelector('[data-field="name"]').value || it.name;
    const daysField = row.querySelector('[data-field="days"]');
    const dateField = row.querySelector('[data-field="date"]');
    if (daysField) it.estimatedShelfLifeDays = daysField.value;
    if (dateField) it.packageExpiryDate = dateField.value;
  }
  items.push({
    id:`i_${Date.now()}`, name: it.name, zone: it.zone, addedDate: todayISO(),
    shelfLifeDays: it.type === "fresh" ? (Number(it.estimatedShelfLifeDays) || 7) : null,
    expiryDate: it.type === "frozen" ? (it.packageExpiryDate || null) : null,
  });
  await saveItems(items);
  pending = pending.filter(p => p.tempId !== tempId);
  renderPending();
  render();
}

init();
</script>
</body>
</html>
